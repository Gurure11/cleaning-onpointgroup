<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onpoint Cleaning - Task Timer System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .staff-info {
            background: #f8f9fa;
            padding: 25px;
            border-bottom: 2px solid #e9ecef;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #495057;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }

        .departments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            padding: 25px;
        }

        .department-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .department-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .department-header h3 {
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .department-header .staff-assign {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .tasks-list {
            padding: 20px;
        }

        .task-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #1e3c72;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-name {
            font-weight: 600;
            color: #1e3c72;
            font-size: 1.1em;
        }

        .timer-display {
            font-family: monospace;
            font-size: 1.2em;
            font-weight: bold;
            color: #2a5298;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }

        .time-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-start {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .btn-stop {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .btn-start:disabled, .btn-stop:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .time-records {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #dee2e6;
        }

        .time-record {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .department-submit {
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            text-align: center;
        }

        .btn-submit-department {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s;
            font-weight: 600;
        }

        .btn-submit-department:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 60, 114, 0.3);
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .global-timestamp {
            text-align: right;
            padding: 10px 25px;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 0.9em;
            border-top: 1px solid #e9ecef;
        }

        @media (max-width: 768px) {
            .departments-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧹 Onpoint Task Management System</h1>
            <p>Real-time Task Tracking & Time Management</p>
        </div>

        <div class="staff-info">
            <div class="form-grid">
                <div class="form-group">
                    <label>👤 Staff Name *</label>
                    <input type="text" id="staffName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>📋 Employee ID</label>
                    <input type="text" id="employeeId" placeholder="Enter employee ID">
                </div>
                <div class="form-group">
                    <label>📅 Date</label>
                    <input type="date" id="workDate">
                </div>
                <div class="form-group">
                    <label>🏢 Department</label>
                    <select id="globalDepartment">
                        <option value="Cleaning">Cleaning Department</option>
                        <option value="Maintenance">Maintenance Department</option>
                        <option value="Gardening">Gardening Department</option>
                        <option value="Repairs">Repairs Department</option>
                        <option value="Painting">Painting Department</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="departments-grid" id="departmentsContainer">
            <!-- Departments will be dynamically generated here -->
        </div>

        <div class="global-timestamp" id="globalTimestamp"></div>
    </div>

    <script>
        // Configuration - Your Google Apps Script URL
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_T2OgWynPXIYIF625O9vxDbfPqhCb0aF3A89NrgN3rKw5CPvx22kJMBjNopQzLKvjdg/exec';

        // Department definitions with their specific tasks
        const departments = [
            {
                name: "Cleaning Department",
                tasks: ["Toilets Cleaning", "Kitchen Cleaning", "Office Cleaning", "Floor Mopping", "Window Cleaning", "Carpet Vacuuming", "Surface Dusting", "Waste Removal"]
            },
            {
                name: "Maintenance Department",
                tasks: ["General Repairs", "Plumbing Work", "Electrical Work", "HVAC Maintenance", "Equipment Repair", "Lighting Repairs", "Door Repairs", "Furniture Repair"]
            },
            {
                name: "Gardening Department",
                tasks: ["Grass Cutting", "Weeding", "Lawn Mowing", "Hedge Trimming", "Plant Pruning", "Garden Watering", "Leaf Blowing", "Flower Bed Maintenance"]
            },
            {
                name: "Repairs Department",
                tasks: ["Structural Repairs", "Wall Repairs", "Ceiling Repairs", "Floor Repairs", "Roof Repairs", "Fence Repairs", "Plastering", "Tiling Repairs"]
            },
            {
                name: "Painting Department",
                tasks: ["Interior Painting", "Exterior Painting", "Wall Preparation", "Ceiling Painting", "Door Painting", "Window Frame Painting", "Touch-up Work", "Texture Application"]
            }
        ];

        // Store active timers for each task
        const timers = {};
        const timeRecords = {};

        // Initialize departments
        function initializeDepartments() {
            const container = document.getElementById('departmentsContainer');
            container.innerHTML = '';

            departments.forEach((dept, deptIndex) => {
                const deptCard = createDepartmentCard(dept, deptIndex);
                container.appendChild(deptCard);
            });
        }

        function createDepartmentCard(department, deptIndex) {
            const card = document.createElement('div');
            card.className = 'department-card';
            card.id = `dept-${deptIndex}`;

            // Header
            const header = document.createElement('div');
            header.className = 'department-header';
            header.innerHTML = `
                <h3>${department.name}</h3>
                <div class="staff-assign" id="staff-${deptIndex}">Assigned to: <span id="assigned-staff-${deptIndex}">Not assigned</span></div>
            `;
            card.appendChild(header);

            // Tasks list
            const tasksDiv = document.createElement('div');
            tasksDiv.className = 'tasks-list';
            
            department.tasks.forEach((task, taskIndex) => {
                const taskId = `task-${deptIndex}-${taskIndex}`;
                const taskDiv = createTaskItem(task, deptIndex, taskIndex, taskId);
                tasksDiv.appendChild(taskDiv);
            });
            
            card.appendChild(tasksDiv);

            // Submit button for department
            const submitDiv = document.createElement('div');
            submitDiv.className = 'department-submit';
            submitDiv.innerHTML = `
                <button class="btn-submit-department" onclick="submitDepartmentTasks(${deptIndex})">
                    📤 Submit ${department.name} Tasks
                </button>
                <div id="status-${deptIndex}" class="status-message"></div>
            `;
            card.appendChild(submitDiv);

            return card;
        }

        function createTaskItem(task, deptIndex, taskIndex, taskId) {
            const taskDiv = document.createElement('div');
            taskDiv.className = 'task-item';
            taskDiv.id = taskId;

            // Initialize timer data for this task
            if (!timers[taskId]) {
                timers[taskId] = {
                    startTime: null,
                    endTime: null,
                    elapsedSeconds: 0,
                    isRunning: false,
                    interval: null
                };
            }

            if (!timeRecords[taskId]) {
                timeRecords[taskId] = [];
            }

            // Task header
            const headerDiv = document.createElement('div');
            headerDiv.className = 'task-header';
            headerDiv.innerHTML = `
                <span class="task-name">${task}</span>
                <span class="timer-display" id="${taskId}-timer">00:00:00</span>
            `;
            taskDiv.appendChild(headerDiv);

            // Control buttons
            const controlsDiv = document.createElement('div');
            controlsDiv.className = 'time-controls';
            controlsDiv.innerHTML = `
                <button class="btn-start" onclick="startTimer('${taskId}')" id="${taskId}-start">▶ Start</button>
                <button class="btn-stop" onclick="stopTimer('${taskId}')" id="${taskId}-stop" disabled>⏹ Stop</button>
            `;
            taskDiv.appendChild(controlsDiv);

            // Records display
            const recordsDiv = document.createElement('div');
            recordsDiv.className = 'time-records';
            recordsDiv.id = `${taskId}-records`;
            recordsDiv.innerHTML = '<div class="time-record">No completed sessions yet</div>';
            taskDiv.appendChild(recordsDiv);

            return taskDiv;
        }

        // Timer functions
        function startTimer(taskId) {
            const staffName = document.getElementById('staffName').value;
            if (!staffName) {
                alert('Please enter staff name first');
                return;
            }

            const timer = timers[taskId];
            if (timer.isRunning) return;

            timer.startTime = new Date();
            timer.isRunning = true;
            timer.interval = setInterval(() => updateTimerDisplay(taskId), 1000);

            // Update UI
            document.getElementById(`${taskId}-start`).disabled = true;
            document.getElementById(`${taskId}-stop`).disabled = false;

            // Update assigned staff display
            const deptIndex = taskId.split('-')[1];
            document.getElementById(`assigned-staff-${deptIndex}`).textContent = staffName;
        }

        function stopTimer(taskId) {
            const timer = timers[taskId];
            if (!timer.isRunning) return;

            timer.endTime = new Date();
            timer.isRunning = false;
            clearInterval(timer.interval);

            // Calculate elapsed time
            const elapsedMs = timer.endTime - timer.startTime;
            const elapsedSeconds = Math.floor(elapsedMs / 1000);
            timer.elapsedSeconds = elapsedSeconds;

            // Record this session
            recordTaskSession(taskId);

            // Update UI
            document.getElementById(`${taskId}-start`).disabled = false;
            document.getElementById(`${taskId}-stop`).disabled = true;

            // Reset timer display to zero
            updateTimerDisplay(taskId, true);
        }

        function updateTimerDisplay(taskId, reset = false) {
            const timer = timers[taskId];
            const display = document.getElementById(`${taskId}-timer`);
            
            if (reset) {
                display.textContent = '00:00:00';
                return;
            }

            if (timer.isRunning) {
                const now = new Date();
                const elapsedMs = now - timer.startTime;
                const seconds = Math.floor(elapsedMs / 1000);
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                
                display.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
        }

        function recordTaskSession(taskId) {
            const timer = timers[taskId];
            const staffName = document.getElementById('staffName').value;
            const employeeId = document.getElementById('employeeId').value;
            
            const session = {
                staffName,
                employeeId,
                startTime: timer.startTime,
                endTime: timer.endTime,
                durationSeconds: timer.elapsedSeconds,
                date: document.getElementById('workDate').value
            };

            timeRecords[taskId].push(session);
            updateRecordsDisplay(taskId);
        }

        function updateRecordsDisplay(taskId) {
            const records = timeRecords[taskId];
            const recordsDiv = document.getElementById(`${taskId}-records`);
            
            if (records.length === 0) {
                recordsDiv.innerHTML = '<div class="time-record">No completed sessions yet</div>';
                return;
            }

            let html = '';
            records.slice(-3).reverse().forEach(record => {
                const minutes = Math.floor(record.durationSeconds / 60);
                const seconds = record.durationSeconds % 60;
                html += `
                    <div class="time-record">
                        <span>${record.staffName}</span>
                        <span>${minutes}m ${seconds}s</span>
                    </div>
                `;
            });
            
            recordsDiv.innerHTML = html;
        }

        // Submit tasks for a specific department
        async function submitDepartmentTasks(deptIndex) {
            const department = departments[deptIndex];
            const staffName = document.getElementById('staffName').value;
            const statusDiv = document.getElementById(`status-${deptIndex}`);
            
            if (!staffName) {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '❌ Please enter staff name';
                statusDiv.style.display = 'block';
                setTimeout(() => statusDiv.style.display = 'none', 3000);
                return;
            }

            // Collect all task data for this department
            const taskData = [];
            
            department.tasks.forEach((task, taskIndex) => {
                const taskId = `task-${deptIndex}-${taskIndex}`;
                const sessions = timeRecords[taskId] || [];
                
                sessions.forEach(session => {
                    taskData.push({
                        department: department.name,
                        task: task,
                        staffName: session.staffName,
                        employeeId: session.employeeId,
                        startTime: session.startTime.toISOString(),
                        endTime: session.endTime.toISOString(),
                        durationSeconds: session.durationSeconds,
                        durationMinutes: Math.round(session.durationSeconds / 60),
                        date: session.date,
                        submissionTimestamp: new Date().toLocaleString('en-ZA', { timeZone: 'Africa/Johannesburg' })
                    });
                });
            });

            if (taskData.length === 0) {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '❌ No completed tasks to submit';
                statusDiv.style.display = 'block';
                setTimeout(() => statusDiv.style.display = 'none', 3000);
                return;
            }

            // Submit data
            try {
                statusDiv.className = 'status-message';
                statusDiv.textContent = 'Submitting...';
                statusDiv.style.display = 'block';

                const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        department: department.name,
                        tasks: taskData,
                        submittedBy: staffName,
                        timestamp: new Date().toLocaleString('en-ZA', { timeZone: 'Africa/Johannesburg' })
                    })
                });

                statusDiv.className = 'status-message success';
                statusDiv.textContent = `✅ ${taskData.length} tasks submitted successfully!`;
                
                // Clear submitted sessions
                department.tasks.forEach((task, taskIndex) => {
                    const taskId = `task-${deptIndex}-${taskIndex}`;
                    timeRecords[taskId] = [];
                    updateRecordsDisplay(taskId);
                });

                setTimeout(() => statusDiv.style.display = 'none', 5000);

            } catch (error) {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = '❌ Submission failed';
                console.error('Submission error:', error);
                setTimeout(() => statusDiv.style.display = 'none', 3000);
            }
        }

        // Update global timestamp
        function updateGlobalTimestamp() {
            const now = new Date();
            const timestamp = document.getElementById('globalTimestamp');
            timestamp.textContent = `Last updated: ${now.toLocaleString('en-ZA', { timeZone: 'Africa/Johannesburg' })}`;
        }

        // Initialize on page load
        window.onload = function() {
            initializeDepartments();
            updateGlobalTimestamp();
            setInterval(updateGlobalTimestamp, 1000);

            // Set default date
            const today = new Date();
            document.getElementById('workDate').value = today.toISOString().split('T')[0];
        };
    </script>
</body>
</html>
